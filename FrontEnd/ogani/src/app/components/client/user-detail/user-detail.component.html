<section class="breadcrumb-section set-bg" [ngStyle]="{backgroundImage:'url(assets/image/breadcrumb.jpg'}">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="breadcrumb__text">
                    <h2>UserDetail</h2>
                    <div class="breadcrumb__option">
                        <a routerLink="/">Home</a>
                        <span>User</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="user mt-5 mb-5">
    <div class="container">
        <div class="row">
            <div class="col-md-3 border-right" *ngIf="user != null">
                <div class="d-flex flex-column align-items-center text-center p-3 py-5">
                    <img class="rounded-circle mt-5" width="150px" height="150px"
                        [src]="profileImageUrl || 'assets/image/author.jpg'" [alt]="user.username"
                        (error)="onImageError($event)" referrerpolicy="no-referrer"
                        pTooltip="Ảnh đại diện của tài khoản {{user.username}}">
                    <span class="font-weight-bold mt-2">{{user.username}}</span>
                    <span class="text-black-50">{{user.email}}</span>
                    <div class="mt-3">
                        <input type="file" #fileInput style="display: none" accept="image/*"
                            (change)="onFileSelected($event)">
                        <button class="btn btn-primary" (click)="fileInput.click()"
                            pTooltip="Tải lên ảnh đại diện mới từ máy tính">
                            <i class="pi pi-upload mr-1"></i> Đổi ảnh đại diện
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-md-5 border-right">
                <div class="p-3 py-5">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="text-right">Profile Settings</h4>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6"><label class="labels">First Name</label>
                            <input type="text" class="form-control" placeholder="First Name"
                                [(ngModel)]="updateForm.firstname" name="firstname">
                        </div>
                        <div class="col-md-6"><label class="labels">Last Name</label>
                            <input type="text" class="form-control" placeholder="Last Name"
                                [(ngModel)]="updateForm.lastname" name="lastname">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12"><label class="labels">PhoneNumber</label>
                            <input type="text" class="form-control" placeholder="Phone Number"
                                [(ngModel)]="updateForm.phone" name="phone">
                        </div>
                        <div class="col-md-12"><label class="labels">Address</label>
                            <input type="text" class="form-control" placeholder="Address"
                                [(ngModel)]="updateForm.address" name="address">
                        </div>
                        <div class="col-md-12"><label class="labels">Email</label>
                            <input type="text" class="form-control" placeholder="Email" [(ngModel)]="updateForm.email"
                                name="email">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6"><label class="labels">Country</label>
                            <input type="text" class="form-control" placeholder="country"
                                [(ngModel)]="updateForm.country" name="country">
                        </div>
                        <div class="col-md-6"><label class="labels">State/Region</label>
                            <input type="text" class="form-control" placeholder="state" [(ngModel)]="updateForm.state"
                                name="state">
                        </div>
                    </div>
                    <div class="mt-5 text-center">
                        <button class="btn btn-primary profile-button" type="button" (click)="updateProfile()">Save
                            Profile</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 py-5">
                    <div class="col-md-12">
                        <button pButton pRipple type="button" label="Change Password" icon="pi pi-key"
                            class="p-button-primary" (click)="showChangePassword()"></button>
                        <p-dialog header="Đổi mật khẩu" [(visible)]="changePassword" [style]="{width: '30vw'}"
                            [modal]="true" [transitionOptions]="'.3s'">
                            <form action="" #pwdForm="ngForm">
                                <div class="p-field">
                                    <label for="oldPassword">Mật khẩu hiện tại: </label>
                                    <input type="password" pInputText class="w-full mt-2"
                                        [(ngModel)]="changePasswordForm.oldPassword" name="oldPassword" required
                                        minlength="6" #oldPassword="ngModel">
                                    <small *ngIf="oldPassword.invalid && (oldPassword.dirty || oldPassword.touched)"
                                        class="p-error block">
                                        <div *ngIf="oldPassword.errors?.['required']">Mật khẩu hiện tại là bắt buộc
                                        </div>
                                        <div *ngIf="oldPassword.errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự
                                        </div>
                                    </small>
                                </div>
                                <div class="p-field mt-3">
                                    <label for="newPassword">Mật khẩu mới: </label>
                                    <input type="password" pInputText class="w-full mt-2" name="newPassword"
                                        [(ngModel)]="changePasswordForm.newPassword" required minlength="6"
                                        #newPassword="ngModel">
                                    <small *ngIf="newPassword.invalid && (newPassword.dirty || newPassword.touched)"
                                        class="p-error block">
                                        <div *ngIf="newPassword.errors?.['required']">Mật khẩu mới là bắt buộc</div>
                                        <div *ngIf="newPassword.errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự
                                        </div>
                                    </small>
                                </div>
                                <div class="p-field mt-3">
                                    <label for="confirmPassword">Xác nhận mật khẩu mới: </label>
                                    <input type="password" pInputText class="w-full mt-2" name="confirmPassword"
                                        [(ngModel)]="confirmPassword" required #pwdConfirm="ngModel">
                                    <small
                                        *ngIf="confirmPassword && changePasswordForm.newPassword && confirmPassword !== changePasswordForm.newPassword"
                                        class="p-error block">
                                        Mật khẩu xác nhận không khớp
                                    </small>
                                </div>
                                <div class="p-field mt-3">
                                    <button type="button" pButton
                                        [disabled]="pwdForm.invalid || (confirmPassword !== changePasswordForm.newPassword)"
                                        (click)="changePasswordFunc()">Lưu</button>
                                    <button pButton type="button" class="p-button-danger ml-3"
                                        (click)="changePassword=false">Hủy</button>
                                </div>
                            </form>
                        </p-dialog>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<p-toast position="top-right"></p-toast>
