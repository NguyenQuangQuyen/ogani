<p-toast></p-toast>

<!-- Breadcrumb Section Begin -->
<section class="breadcrumb-section set-bg" [ngStyle]="{backgroundImage:'url(assets/image/breadcrumb.jpg'}">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="breadcrumb__text">
                    <h2>Liên Hệ</h2>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Breadcrumb Section End -->

<!-- Contact Section Begin -->
<section class="contact spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-3 col-sm-6 text-center">
                <div class="contact__widget">
                    <span class="icon_phone"></span>
                    <h4>Điện thoại</h4>
                    <p>+84 974 580 133</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-3 col-sm-6 text-center">
                <div class="contact__widget">
                    <span class="icon_pin_alt"></span>
                    <h4>Địa chỉ</h4>
                    <p>Cổ Nhuế 2, Bắc Từ Liêm, Hà Nội</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-3 col-sm-6 text-center">
                <div class="contact__widget">
                    <span class="icon_clock_alt"></span>
                    <h4>Giờ mở cửa</h4>
                    <p>08:00 - 22:00</p>
                </div>
            </div>
            <div class="col-lg-3 col-md-3 col-sm-6 text-center">
                <div class="contact__widget">
                    <span class="icon_mail_alt"></span>
                    <h4>Email</h4>
                    <p>quyenquy053&#64;gmail.com</p>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Contact Section End -->

<!-- Social Links Section Begin -->
<section class="contact-social">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="contact__social__links">
                    <h4>Theo dõi chúng tôi</h4>
                    <div class="social-icons">
                        <a *ngFor="let social of socialLinks" href="{{ social.url }}" target="_blank"
                            class="{{ social.name }}" title="{{ social.label }}">
                            <img [src]="social.logoSrc" [alt]="social.label" class="social-logo">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Social Links Section End -->

<!-- Map Begin -->
<div class="map">
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.4738307952684!2d105.76081037490909!3d21.053768980526543!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x313454f777de8cad%3A0x3c935fbf668b23c0!2zQ-G7lSBOaHXhur8gMiwgQuG6r2MgVOG7qyBMacOqbSwgSMOgIE7hu5lpLCBWaeG7h3QgTmFt!5e0!3m2!1svi!2s!4v1623158893675!5m2!1svi!2s"
        height="500" style="border:0;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
    <div class="map-inside">
        <i class="icon_pin"></i>
        <div class="inside-widget">
            <h4>Cổ Nhuế 2</h4>
            <ul>
                <li>Điện thoại: +84 974 580 133</li>
                <li>Địa chỉ: Cổ Nhuế 2, Bắc Từ Liêm, Hà Nội</li>
            </ul>
        </div>
    </div>
</div>
<!-- Map End -->

<!-- Contact Form Begin -->
<div class="contact-form spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="contact__form__title">
                    <h2>Liên hệ với chúng tôi</h2>
                </div>
            </div>
        </div>
        <form action="#">
            <div class="row">
                <div class="col-lg-6 col-md-6">
                    <input type="text" placeholder="Tên của bạn" [(ngModel)]="contactForm.name" name="name">
                </div>
                <div class="col-lg-6 col-md-6">
                    <input type="text" placeholder="Email của bạn" [(ngModel)]="contactForm.email" name="email">
                </div>
                <div class="col-lg-12 text-center">
                    <textarea placeholder="Nội dung tin nhắn" [(ngModel)]="contactForm.message" name="message"></textarea>
                    <button type="button" class="site-btn" (click)="sendMessage()">GỬI TIN NHẮN</button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- Contact Form End -->
